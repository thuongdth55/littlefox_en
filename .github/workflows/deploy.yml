name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject FIREBASE_URL secret + build id
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: |
          if [ -z "$FIREBASE_URL" ]; then
            echo "::error::Chưa có secret FIREBASE_URL (Settings > Secrets and variables > Actions)"
            exit 1
          fi

          # Tự tìm thư mục chứa config.js (public/, thư mục gốc, hoặc thư mục con khác)
          CFG=$(find . -name config.js -not -path "./.git/*" | head -n1)
          if [ -z "$CFG" ]; then
            echo "::error::Không tìm thấy config.js trong repo. Cấu trúc hiện có:"
            find . -not -path "./.git/*" -type f | sort
            exit 1
          fi
          SITE=$(dirname "$CFG")
          echo "SITE_DIR=$SITE" >> "$GITHUB_ENV"
          echo "Site dir: $SITE"

          sed -i "s|__FIREBASE_URL__|${FIREBASE_URL}|g" "$SITE/config.js"
          if [ -f "$SITE/sw.js" ]; then
            sed -i "s|__BUILD__|${GITHUB_SHA}|g" "$SITE/sw.js"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - id: deployment
        uses: actions/deploy-pages@v4
